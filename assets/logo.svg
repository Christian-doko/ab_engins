<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="AB ENGINS">
  <title>AB ENGINS</title>
  <!-- Hexagone jaune -->
  <polygon points="50,8 150,8 192,100 150,192 50,192 8,100"
           fill="#F2E30D" stroke="#0f4023" stroke-width="3" stroke-linejoin="round"/>

  <!-- Chargeuse sur chenilles -->
  <g fill="#ffffff" stroke="#16211b" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Godet -->
    <path d="M36 108 L36 78 L52 78 L52 104 Z"/>
    <!-- Bras -->
    <path d="M52 84 L86 74"/>
    <!-- Cabine -->
    <path d="M86 58 L134 58 L140 88 L86 88 Z"/>
