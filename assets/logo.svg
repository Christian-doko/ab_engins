  </g>
  <g fill="#16211b">
    <circle cx="70" cy="128" r="7"/>
    <circle cx="103" cy="128" r="7"/>
    <circle cx="136" cy="128" r="7"/>
  </g>

  <!-- Bandeau vert -->
  <rect x="28" y="150" width="144" height="30" rx="4" fill="#1f7a3d" stroke="#0f4023" stroke-width="2.5"/>
  <text x="100" y="171" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800"
        letter-spacing="1.5" fill="#ffffff">AB ENGINS</text>
